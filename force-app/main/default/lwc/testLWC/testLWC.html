<template>
    <lightning-card title="Search Contact">
        <lightning-input label="Enter Contact Name" value={searchKey} onchange={handleKeyChange}>
        </lightning-input>
        <lightning-button label="Search" onclick={handleSearch} class="slds-m-top_small">
        </lightning-button>
        <template if:true={contacts}>
            <template for:each={contacts} for:item="contact">
                <p key={contact.Id}>
                    {contact.Name} - {contact.Email}
                </p>
            </template>
        </template>
        <template if:false={contacts}>
            <p>No Contact Found</p>
        </template>
    </lightning-card>
</template>

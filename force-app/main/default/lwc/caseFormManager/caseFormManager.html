<template>
    <lightning-record-edit-form
        object-api-name="Case"
        onsuccess={handleSuccess}
        record-id={recordId}
    >
        <lightning-messages></lightning-messages>

        <lightning-input-field field-name="ContactId" onchange={handleContactChange}></lightning-input-field>

        <template if:true={siteOptions.length}>
            <lightning-combobox
                name="Site"
                label="Site"
                value={selectedSite}
                options={siteOptions}
                onchange={handleSiteChange}
            ></lightning-combobox>
        </template>

        <template if:true={studyOptions.length}>
            <lightning-combobox
                name="Study"
                label="Study"
                value={selectedStudy}
                options={studyOptions}
                onchange={handleStudyChange}
            ></lightning-combobox>
        </template>

        <lightning-button type="submit" label="Save" class="slds-m-top_medium"></lightning-button>
    </lightning-record-edit-form>
</template>
